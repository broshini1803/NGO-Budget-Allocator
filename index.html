<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NGO Budget Allocation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>NGO Budget Allocator</h1>

    <label for="budget">Total Budget (₹):</label>
    <input type="number" id="budget" placeholder="Enter total budget" />

    <div id="project-inputs" class="card-container">
      <!-- Dynamic project cards will appear here -->
    </div>

    <div class="btn-group">
      <button onclick="addProject()">+ Add Project</button>
      <button onclick="runMergeSort()">Run Merge Sort</button>
      <button onclick="runKnapsack()">Run Knapsack</button>
    </div>

    <h2>Output</h2>
    <div id="output"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
